<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To You</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #85444f;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      text-align: center;
      pointer-events: none;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .title {
      color: rgba(255, 230, 240, 0.95);
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 6px;
      text-shadow: 0 0 20px rgba(255, 75, 130, 0.8);
      white-space: nowrap;
    }
    .subtitle {
      margin-top: 15px;
      color: rgba(255, 180, 200, 0.75);
      font-size: 0.95rem;
      letter-spacing: 3px;
      height: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="title" id="title"></div>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // 心形隐函数采样
    function heartFunction(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    const PARTICLE_COUNT = 2200;
    const particles = [];
    const scale = Math.min(width, height) / 40;

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const step = Math.random() * Math.PI * 2;
      const basePoint = heartFunction(step);
      const spread = Math.pow(Math.random(), 2);
      
      particles.push({
        baseX: basePoint.x * scale * (0.8 + 0.2 * Math.random()),
        baseY: basePoint.y * scale * (0.8 + 0.2 * Math.random()),
        x: (Math.random() - 0.5) * width,
        y: (Math.random() - 0.5) * height,
        vx: 0,
        vy: 0,
        size: Math.random() * 1.8 + 0.6,
        alpha: Math.random() * 0.7 + 0.3,
        hue: 330 + Math.random() * 30, // 粉紫红主色调
        driftSpeed: Math.random() * 0.02 + 0.01,
        angleOffset: Math.random() * Math.PI * 2
      });
    }

    let mouseX = width / 2;
    let mouseY = height / 2;
    let time = 0;

    window.addEventListener("mousemove", (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    window.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      }
    });

    function render() {
      // 拖尾清屏
      ctx.fillStyle = "rgba(5, 5, 12, 0.2)";
      ctx.fillRect(0, 0, width, height);

      time += 0.035;
      // 模拟心跳节律：双峰跳动
      const beat = 1 + 0.12 * Math.sin(time) * Math.pow(Math.sin(time * 2), 4);

      const centerX = width / 2;
      const centerY = height / 2;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particles[i];

        // 目标心形位置 + 心跳放大
        const targetX = centerX + p.baseX * beat;
        const targetY = centerY + p.baseY * beat;

        // 弹簧阻尼跟随
        const dx = targetX - p.x;
        const dy = targetY - p.y;
        p.vx += dx * 0.04;
        p.vy += dy * 0.04;
        p.vx *= 0.82;
        p.vy *= 0.82;

        // 鼠标排斥互动
        const mdx = p.x - mouseX;
        const mdy = p.y - mouseY;
        const mDist = Math.sqrt(mdx * mdx + mdy * mdy);
        if (mDist < 120) {
          const force = (120 - mDist) * 0.08;
          p.vx += (mdx / mDist) * force;
          p.vy += (mdy / mDist) * force;
        }

        p.x += p.vx;
        p.y += p.vy;

        // 微弱光芒扰动
        const glow = Math.sin(time * 2 + p.angleOffset) * 0.2 + 0.8;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue}, 90%, 65%, ${p.alpha * glow})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = `hsla(${p.hue}, 90%, 60%, 0.8)`;
        ctx.fill();
      }

      requestAnimationFrame(render);
    }

    render();

    const titleText = "这两天辛苦啦~";
    const subtitleText = "无论有多难走的路，我都会陪你走下去👀👀";
    
    let tIdx = 0;
    let sIdx = 0;

    function typeTitle() {
      if (tIdx <= titleText.length) {
        document.getElementById("title").innerText = titleText.slice(0, tIdx);
        tIdx++;
        setTimeout(typeTitle, 140);
      } else {
        setTimeout(typeSubtitle, 400);
      }
    }

    function typeSubtitle() {
      if (sIdx <= subtitleText.length) {
        document.getElementById("subtitle").innerText = subtitleText.slice(0, sIdx);
        sIdx++;
        setTimeout(typeSubtitle, 80);
      }
    }

    setTimeout(typeTitle, 800);
  </script>
</body>
</html>
